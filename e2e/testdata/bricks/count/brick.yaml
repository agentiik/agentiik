apiVersion: agentiik.dev/v1
kind: Brick
metadata:
  name: e2e-count
  version: 0.1.0
  summary: Counts the orders it is given and attaches a report, for the test installation's smoke test.
spec:
  inputs:
    orders:
      schema: { type: object }
  outputs:
    ok:
      schema: { type: object }
  runtime:
    network: none
    streaming: false
    user: "65532:65532"
