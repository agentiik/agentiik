apiVersion: agentiik.dev/v1
kind: Brick
metadata:
  name: e2e-sleep
  version: 0.1.0
  summary: Waits the seconds its step gives it and publishes one item naming the step, for the test that kills a runner mid-step.
spec:
  inputs:
    in:
      schema: { type: object }
  outputs:
    ok:
      schema: { type: object }
  params:
    seconds:
      type: integer
      required: true
  runtime:
    network: none
    streaming: false
    user: "65532:65532"
