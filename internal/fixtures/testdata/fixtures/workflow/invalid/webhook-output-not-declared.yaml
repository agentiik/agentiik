# invalid: A sync webhook returning an output the workflow does not declare.
#   What a caller is answered with is one of the workflow's own outputs.
# refused by: the validator, beyond what JSON Schema can state
# reference: https://agentiik.github.io/docs/#triggers

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: price-quotes
  namespace: sales

on:
  webhook:
    - path: /quotes/requested
      response: sync
      output: invoice

outputs:
  quote:
    from: { step: quote, port: out }

steps:
  quote:
    image: ghcr.io/acme/agk-invoice@sha256:1ab74e66e7966eea770c1042664af5f550650f299ce00e02132ffa4fec5039cc
    outputs: [out]
