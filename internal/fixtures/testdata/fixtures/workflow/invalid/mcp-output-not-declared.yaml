# invalid: A tool whose output names something the workflow does not declare.
#   A tool is a view of the workflow's own boundary, so its result is one of
#   the workflow's outputs.
# refused by: the validator, beyond what JSON Schema can state
# reference: https://agentiik.github.io/docs/#publishing-tools

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: invoicing
  namespace: finance

inputs:
  orders:
    schema: { $ref: "./schemas/order.json" }
    required: true

outputs:
  invoices:
    from: { step: normalize, port: ok }

mcp:
  name: create_invoice
  description: Issue one invoice for a customer and return it.
  output: invoice

steps:
  normalize:
    image: ghcr.io/acme/agk-normalize@sha256:9f2c1d073f187ad520aaf67af255db9208210cfac76f1f2426ef8d938079b7e0
    inputs:
      orders: ${{ workflow.inputs.orders }}
    outputs: [ok]
