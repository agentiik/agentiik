# invalid: A secret mounted somewhere other than /agk/secrets/<name>. The
#   runner mounts secret values on tmpfs there, and nowhere else.
# refused by: the schema
# reference: https://agentiik.github.io/docs/#brick-manifest

apiVersion: agentiik.dev/v1
kind: Brick

metadata:
  name: http-request
  version: 1.4.0

spec:
  secrets:
    - name: bearer
      mount: /run/secrets/bearer

  runtime:
    user: "65532:65532"
