# invalid: A secret mounted at /agk/secrets/.., which names the parent of the
#   secrets directory rather than a file in it. A mount's file name begins
#   with a letter or a digit, so a dot inside a name is kept and a name made
#   of dots is refused.
# refused by: the schema
# reference: https://agentiik.github.io/docs/#brick-manifest

apiVersion: agentiik.dev/v1
kind: Brick

metadata:
  name: http-request
  version: 1.4.0

spec:
  secrets:
    - name: bearer
      mount: /agk/secrets/..

  runtime:
    user: "65532:65532"
