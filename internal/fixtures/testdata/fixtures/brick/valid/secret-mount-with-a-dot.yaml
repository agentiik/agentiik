# valid: a secret mounted under a file name carrying a dot, as a key file
#   naturally does, and a secret whose mount is not its name
# reference: https://agentiik.github.io/docs/#brick-manifest

apiVersion: agentiik.dev/v1
kind: Brick

metadata:
  name: pg-export
  version: 1.2.0

spec:
  secrets:
    - name: dsn
      mount: /agk/secrets/dsn
    - name: client-key
      optional: true
      mount: /agk/secrets/client.key

  runtime:
    network: internal
    user: "65532:65532"
