# invoice takes a port normalize does not publish.

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: monthly-invoicing
  namespace: finance

steps:
  fetch:
    image: ghcr.io/acme/agk-fetch-orders:1.2.0
    outputs: [out]

  normalize:
    image: ghcr.io/acme/agk-normalize:2.0.0
    needs: [fetch]
    outputs: [ok, rejected]

  invoice:
    image: ghcr.io/acme/agk-invoice:1.4.0
    needs:
      - step: normalize
        port: accepted
        as: in
    outputs: [out, error]
