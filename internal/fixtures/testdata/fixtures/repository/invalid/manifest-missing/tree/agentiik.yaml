# normalize names its image by digest, and the repository's store has recorded
# no manifest under that digest.

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: monthly-invoicing
  namespace: finance

steps:
  fetch:
    image: ghcr.io/acme/agk-fetch-orders:1.2.0
    outputs: [out]

  normalize:
    image: ghcr.io/acme/agk-normalize@sha256:b49415b1399b63bbb8588eb75fecb98972650e051a94b73b8835672d6c747bb7
    needs: [fetch]
    outputs: [ok, rejected]
