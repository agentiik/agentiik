# normalize, invoice and archive feed one another in a ring.

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: monthly-invoicing
  namespace: finance

steps:
  normalize:
    image: ghcr.io/acme/agk-normalize:2.0.0
    needs:
      - { step: archive, port: out, as: in }
    outputs: [ok, rejected]

  invoice:
    image: ghcr.io/acme/agk-invoice:1.4.0
    needs:
      - { step: normalize, port: ok, as: in }
    outputs: [out, error]

  archive:
    image: ghcr.io/acme/agk-archive:0.3.0
    needs:
      - { step: invoice, port: out, as: in }
    outputs: [out]
