# The manifest ghcr.io/acme/agk-invoice:1.4.0 carries at /agk/brick.yaml, as the namespace's
# store recorded it under the digest the tag is pinned to.

apiVersion: agentiik.dev/v1
kind: Brick

metadata:
  name: issue-invoices
  version: 1.4.0
  summary: Issues one invoice per order through the billing API.

spec:
  inputs:
    in: {}
  outputs:
    out: {}
    error: {}

  params:
    currency: { type: string, pattern: "^[A-Z]{3}$" }
    endpoint: { type: string }
    dunning_days: { type: integer, minimum: 1 }

  secrets:
    - name: billing_api
      optional: true

  runtime:
    network: egress
    user: "65532:65532"
