# A path include names a file the commit does not hold: common-bricks.yaml is
# under fragments/, and this path resolves beside this file.

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: monthly-invoicing
  namespace: finance

include:
  - path: ./common-bricks.yaml

steps:
  fetch:
    image: ghcr.io/acme/agk-fetch-orders:1.2.0
    outputs: [out]
