# A step written in an included file has its own values, above defaults, and
# this file overrides it keyword by keyword. load keeps the timeout its file
# wrote over the 10m of defaults; export takes this file's timeout over its own.
# This file's defaults.retry replaces the included one, and load's params merge
# by name.

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: monthly-invoicing
  namespace: finance

include:
  - path: ./fragments/load.yaml

defaults:
  retry: { max: 4, on: [transient, lost] }

steps:
  fetch:
    image: ghcr.io/acme/agk-fetch-orders:1.2.0
    outputs: [out]

  load:
    resources: { cpu: "2", memory: 1Gi }
    params:
      journal: sales-eu

  export:
    timeout: 1m
