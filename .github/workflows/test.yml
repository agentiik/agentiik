# The four commands the README names, run on every push and every pull request. They are
# the same four a person runs locally, in the same order, so that a green checkmark here
# and a clean working copy there mean the one thing.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # A PostgreSQL, because the tests that hold the namespace rule are written against a real
    # one and skip without it. They skip so that a laptop with nothing installed still runs
    # the rest, not so that nobody ever runs them: row level security is not a thing a stub
    # can have an opinion about, and a policy nothing exercises is a policy nobody knows is
    # there. The version is the one the deployment profiles name.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: agk
          POSTGRES_DB: agk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    steps:
      - uses: actions/checkout@v4

      # And a NATS with JetStream, for the same reason the database is here: what the bus
      # tests are about is what WorkQueue retention, durable pull consumers and at-least-once
      # redelivery actually do, and a fake would agree with whatever this code believes about
      # all three.
      #
      # Started here rather than declared as a service because JetStream is an argument,
      # -js, and a service container takes an image and an entrypoint but no arguments. An
      # entrypoint with no -js is a NATS that answers every stream call with "JetStream not
      # enabled", which reads as a broken test rather than as a missing flag.
      - name: bus
        run: |
          docker run -d --name agk-nats -p 4222:4222 nats:alpine -js
          for i in $(seq 1 30); do
            if docker exec agk-nats nats-server --help >/dev/null 2>&1; then break; fi
            sleep 1
          done

      # The image the real-daemon tests run their containers from. A runner has a Docker
      # daemon but no images, and a test that finds one missing skips rather than pull it,
      # since that would make it a test of somebody's registry. It is fetched only as the
      # base a fixture build pulls, or by agk run --local in the milestone test, so without
      # this step every test that came before those skipped. A skip does not show in go
      # test's output, and the job was as green as if they had run.
      # alpine:3.21 is the one image the tests and their fixtures name, pinned for the reason
      # the Go version is: a tag that moves changes what a branch nobody touched runs.
      - name: images
        run: docker pull alpine:3.21

      - uses: actions/setup-go@v5
        with:
          # The version go.mod requires. Pinned to the minor rather than to stable, so
          # that a new Go release is a commit someone makes here and reads, and never a
          # build that changes underneath a branch nobody touched.
          go-version: '1.27'

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # The race detector is not optional here. The artifact store is written for
      # concurrent puts of one key, two steps computing identical bytes being the
      # ordinary case rather than a race to avoid, and that promise is only held if it
      # is tested under -race.
      - name: test
        run: go test ./... -race
        env:
          # A superuser, because the tests create a database of their own, the schema, and
          # the unprivileged role the application connects as. What is under test is what
          # that role can see, and db.Open refuses a superuser for exactly that reason.
          AGENTIIK_TEST_DATABASE_URL: postgres://postgres:agk@127.0.0.1:5432/agk
          AGENTIIK_TEST_BUS_URL: nats://127.0.0.1:4222
          # The daemon and the image are both here, so a real-daemon test that finds either
          # missing has found a broken job rather than a laptop, and fails rather than skips.
          AGENTIIK_TEST_REQUIRE_DOCKER: '1'

      # gofmt has no exit code of its own for this: it lists the files it would rewrite
      # and succeeds either way, so the listing is what the job has to check.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

  # A runner as the page installs one, which the job above cannot be: its daemon does not
  # remap user namespaces, and it runs as an account that holds no capability. Here the
  # daemon is set to userns-remap, the secret values have a tmpfs mounted noexec,nosuid,nodev,
  # and the tests run as the runner's own account holding CAP_CHOWN, CAP_FOWNER and
  # CAP_DAC_OVERRIDE and nothing else, which is what the systemd unit's AmbientCapabilities
  # and CapabilityBoundingSet give the agent. Only the tests written for that host run here;
  # the rest are the job above's.
  userns:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      # userns-remap: default has the daemon create the dockremap account and take its range
      # from /etc/subuid. A remapped daemon keeps its images apart from the ones it held
      # before, so the image is pulled after the restart and not before. The second image is
      # the same one run as 65532, the account a brick is required to run as.
      - name: daemon
        run: |
          echo '{"userns-remap": "default"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.SecurityOptions}}' | grep -q userns
          docker pull alpine:3.21
          printf 'FROM alpine:3.21\nUSER 65532:65532\n' | docker build -t agentiik-test/nonroot:3.21 -

      # The tmpfs the runner writes secret values on, with the flags the floor asks for,
      # owned by the account the tests run as.
      - name: secrets tmpfs
        run: |
          sudo mkdir -p /run/agentiik/secrets
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=0700,uid=$(id -u),gid=$(id -g) tmpfs /run/agentiik/secrets

      # The test binary is built as the account itself, so that the toolchain and its cache
      # are the ones setup-go installed, and then run under setpriv as that same account with
      # the three capabilities ambient and every other one out of its bounding set.
      - name: test
        run: |
          go test -c -o "$RUNNER_TEMP/driver.test" ./driver
          three=+chown,+fowner,+dac_override
          sudo setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            --inh-caps=-all,$three --ambient-caps=-all,$three --bounding-set=-all,$three \
            env HOME="$HOME" TMPDIR=/tmp DOCKER_HOST=unix:///var/run/docker.sock \
              AGENTIIK_TEST_REQUIRE_DOCKER=1 AGENTIIK_TEST_REQUIRE_USERNS=1 \
              AGENTIIK_TEST_SECRETS_DIR=/run/agentiik/secrets \
              sh -c 'grep ^Cap /proc/self/status && cd driver && "$0" -test.v -test.count=1 -test.run "RealRemappedDaemon|RealRunnerHost"' "$RUNNER_TEMP/driver.test"

  # The runner's image, as the page's Compose sample runs it, for both architectures a runner host
  # is: arm64 under QEMU, since a hosted runner is amd64. Each image runs version, and serve, which
  # this daemon refuses at the floor, since it does not remap: the refusal comes after the agent has
  # read its settings from the host's paths as the account the image names and asked the daemon
  # what it is through the socket's group, so it is the whole Compose form but the floor.
  #
  # Then, on amd64, the daemon is set to userns-remap and serve runs past the floor. That is what
  # proves the three capabilities: cap_add leaves an account that is not root none, and the ones
  # the agent holds are the file capabilities the image set on it, which a multi-stage COPY has to
  # have kept. The same image with the file capabilities removed, run the same way, is refused
  # naming them, so the one that passed passed on the file's and not on anything else.
  #
  # The shell runs with pipefail, so no pipeline here ends in grep -q, which stops reading at its
  # first match and would fail the command writing to it with SIGPIPE.
  runner-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash with -eo pipefail, which a step that names no shell does not get.
        shell: bash
    # A serve that starts where it should have been refused runs until it is stopped, and every
    # foreground one below is also held to two minutes.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # The binaries the image is built from, built as the release builds them and as the
      # Dockerfile's own comment says, then one image per architecture loaded into the daemon.
      - name: build
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          for arch in amd64 arm64; do
            for cmd in agk-runner agk-helper; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' \
                -o "$RUNNER_TEMP/image/$cmd-linux-$arch" ./cmd/$cmd
            done
            docker buildx build --platform linux/$arch --load -t agentiik-test/runner:$arch \
              -f build/runner.Dockerfile "$RUNNER_TEMP/image"
          done

      # The host as the page lays it out: runner.env, runner.toml and the key owned by the image's
      # account, 65532, and the secrets tmpfs mounted noexec,nosuid,nodev. /var/lib/agentiik is
      # left root's, as Docker creates a bind source, for the image started as root to give it. runner.env
      # and the key are what join writes, with an API nothing listens at, since serve calls none
      # before it is ready.
      - name: host
        run: |
          sudo mkdir -p /etc/agentiik /var/lib/agentiik /run/agentiik/secrets
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=0700,uid=65532,gid=65532 tmpfs /run/agentiik/secrets
          printf '%s\n' AGK_API=http://127.0.0.1:9 AGK_RUNNER_ID=runner-ci-01 AGK_RUNNER_POOL=ci \
            AGK_RUNNER_LABELS=zone=ci AGK_RUNNER_CREDENTIAL=agkrunner_Xy9QkZ3v0bq8LrT2mN5pW7sD1fG4hJ6kA9cE0uI3oY2 \
            | sudo tee /etc/agentiik/runner.env >/dev/null
          echo 'secrets_dir = "/run/agentiik/secrets"' | sudo tee /etc/agentiik/runner.toml >/dev/null
          sudo openssl genpkey -algorithm ed25519 -out /var/lib/agentiik/runner.key
          sudo chown 65532:65532 /etc/agentiik/runner.env /etc/agentiik/runner.toml /var/lib/agentiik/runner.key
          sudo chmod 600 /etc/agentiik/runner.env /etc/agentiik/runner.toml /var/lib/agentiik/runner.key

          # The Compose sample's runner service, as docker run options: started as root, which
          # serve drops after taking the socket's group itself. nonroot_form is the image started
          # as agentiik with the group named, which serves as it did before serve dropped root.
          cat > "$RUNNER_TEMP/compose.sh" <<'SH'
          compose_form() {
            echo --userns host \
              --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add DAC_OVERRIDE --cap-add SETUID --cap-add SETGID \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v /var/lib/agentiik:/var/lib/agentiik \
              -v /run/agentiik/secrets:/run/agentiik/secrets \
              -v /etc/agentiik:/etc/agentiik
          }
          nonroot_form() {
            echo --user agentiik --group-add "$(stat -c %g /var/run/docker.sock)" --userns host \
              --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add DAC_OVERRIDE \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v /var/lib/agentiik:/var/lib/agentiik \
              -v /run/agentiik/secrets:/run/agentiik/secrets \
              -v /etc/agentiik:/etc/agentiik
          }
          SH

      - name: both architectures
        run: |
          . "$RUNNER_TEMP/compose.sh"
          for arch in amd64 arm64; do
            image=agentiik-test/runner:$arch
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' $image)
            test "$platform" = linux/$arch || { echo "$image is $platform"; exit 1; }

            # The helper is the image's own architecture and static, which is what lets a
            # script step exec it.
            c=$(docker create --platform linux/$arch $image)
            docker cp "$c:/usr/local/lib/agentiik/agk-helper" "$RUNNER_TEMP/helper-$arch"
            docker rm "$c" >/dev/null
            machine=$([ $arch = amd64 ] && echo x86-64 || echo aarch64)
            file "$RUNNER_TEMP/helper-$arch" | tee /dev/stderr | grep "$machine" | grep 'statically linked' >/dev/null

            version=$(docker run --rm --platform linux/$arch $(compose_form) $image version)
            echo "$arch: agk-runner $version"
            echo "$version" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' >/dev/null

            for form in compose_form nonroot_form; do
              if said=$(timeout 120 docker run --rm --platform linux/$arch $($form) $image 2>&1); then
                echo "serve started on a daemon that does not remap user namespaces:"; echo "$said"; exit 1
              fi
              echo "$said"
              echo "$said" | grep 'does not remap user namespaces' >/dev/null
              # Started as root, it said so, and dropped before the floor refused the daemon.
              [ $form = nonroot_form ] || echo "$said" | grep 'started as root' >/dev/null
            done
          done
          # The image started as root gave the agent the directory Docker would have left root's.
          test "$(stat -c %u /var/lib/agentiik)" = 65532

      - name: past the floor
        run: |
          docker save agentiik-test/runner:amd64 -o "$RUNNER_TEMP/runner.tar"
          echo '{"userns-remap": "default"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.SecurityOptions}}' | grep userns >/dev/null
          docker load -i "$RUNNER_TEMP/runner.tar"

          . "$RUNNER_TEMP/compose.sh"
          image=agentiik-test/runner:amd64

          docker run -d --name agk-runner $(compose_form) $image
          for i in $(seq 1 30); do
            docker logs agk-runner 2>&1 | grep 'serving as runner-ci-01' >/dev/null && break
            [ "$(docker inspect --format '{{.State.Running}}' agk-runner)" = true ] || break
            sleep 1
          done
          docker logs agk-runner
          docker logs agk-runner 2>&1 | grep 'serving as runner-ci-01' >/dev/null
          docker stop agk-runner >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' agk-runner)" = 0

          # The helper the image installs, laid down under the work root, where the daemon
          # finds it at the same path.
          sudo file /var/lib/agentiik/work/.bin/agk | tee /dev/stderr | grep x86-64 >/dev/null

          # The control: the same image with setcap -r on the agent. The builder is the daemon's own,
          # which sees the image loaded above.
          printf '%s\n' 'FROM alpine:3.21 AS strip' \
            "COPY --from=$image /usr/local/bin/agk-runner /agk-runner" \
            'RUN apk add --no-cache libcap-setcap && setcap -r /agk-runner' \
            "FROM $image" \
            'COPY --from=strip /agk-runner /usr/local/bin/agk-runner' \
            | docker buildx build --builder default --load -t agentiik-test/runner:nocaps -
          if said=$(timeout 120 docker run --rm $(compose_form) agentiik-test/runner:nocaps 2>&1); then
            echo "serve started with no file capabilities, and the three were not held:"; echo "$said"; exit 1
          fi
          echo "$said"
          echo "$said" | grep 'lacks CAP_CHOWN' >/dev/null
