# The images an installation pulls, ghcr.io/agentiik/agentiik, runner and postgres-upgrade, built
# for linux/amd64 and linux/arm64 from what build/*.Dockerfile say they hold, and pushed with the
# GITHUB_TOKEN, so that publishing needs no secret of its own. agentiik holds the API, carrying the
# web console, and the controller, which an installation runs as two containers by their commands.
#
#   a v* tag        pushes X.Y.Z and vX.Y.Z, and latest when it is the highest release
#   main            pushes dev, the same build as a release, at every commit
#   another branch  builds everything and pushes to a registry inside the job, never to ghcr.io
#   dispatch        builds an existing tag again, pushing it only from main and with dry_run off
#
# A branch of this repository builds the release too, so that a Dockerfile a pull request breaks is
# found on the pull request and not at the tag, when the version has already been said out loud.
#
# What keeps a branch from publishing is this file as the branch holds it: a branch runs its own copy
# with packages: write, as every workflow does, so anyone who may push a branch here may publish by
# editing it. The plan step keeps an honest branch from publishing by accident, not a dishonest one.
name: release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to build again, such as v0.2.1.
        required: true
        type: string
      dry_run:
        description: Build and check everything, and push nothing to ghcr.io.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# One build of a tag or a branch at a time, a tag's push and its dispatch included, since two builds
# of one tag give two digests and the check of the first would find the second's. A newer commit
# makes the older one's dev and dry run moot; a release is never cancelled, since one pushed halfway
# is worse than one pushed twice.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  image:
    # A fork builds nothing: it cannot push to ghcr.io/agentiik, and its main would try.
    if: github.repository == 'agentiik/agentiik'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      # Each image is published or not on its own: one that fails does not hold the others back,
      # and the run is red either way.
      fail-fast: false
      matrix:
        include:
          # The API carries the web console that is built when it is compiled, and none where it is
          # not, so this image's programs are compiled after the console is built.
          - image: agentiik
            commands: agentiik-api agentiik-controller
            console: true
          # The helper goes into the runner's image, where a script step is given it.
          - image: runner
            commands: agk-runner agk-helper
          # No program of this module goes into it: PostgreSQL from Alpine, and the script that
          # upgrades a data directory with it.
          - image: postgres-upgrade
            commands: ''
            files: build/postgres-upgrade.sh

    defaults:
      run:
        # bash with -eo pipefail, which a step that names no shell does not get.
        shell: bash

    steps:
      # What to build and where it goes, decided from the event alone, before anything is checked
      # out. Only a tag and main publish: a branch, or a dispatch from one, is a dry run whatever
      # it asks for, since dry_run is a field anybody who can push a branch can untick.
      - name: plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$EVENT/$REF_TYPE" in
            push/tag) kind=release tag=$REF_NAME publish=true ;;
            push/branch)
              kind=dev tag=
              if [ "$REF" = refs/heads/main ]; then publish=true; else publish=false; fi ;;
            workflow_dispatch/*)
              kind=release tag=$INPUT_TAG
              if [ "$REF" = refs/heads/main ] && [ "$DRY_RUN" = false ]; then publish=true; else publish=false; fi ;;
            *) echo "release does not run on $EVENT"; exit 1 ;;
          esac
          # A tag is a version and nothing else, since the image is tagged with what follows its v.
          if [ "$kind" = release ] && ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "$tag is not a release tag vMAJOR.MINOR.PATCH"; exit 1
          fi
          if [ "$kind" = release ]; then checkout=refs/tags/$tag; else checkout=$GITHUB_SHA; fi
          if [ "$publish" = true ]; then registry=ghcr.io/agentiik; else registry=localhost:5000/agentiik; fi
          echo "$EVENT on $REF: $kind ${tag:-$GITHUB_SHA}, publish=$publish, to $registry"
          {
            echo "kind=$kind"
            echo "tag=$tag"
            echo "checkout=$checkout"
            echo "publish=$publish"
            echo "registry=$registry"
          } >> "$GITHUB_OUTPUT"

      # With every tag, since the version the binaries record is read from the one on the commit,
      # and whether this release takes latest from the ones beside it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.checkout }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # The version go.mod requires, pinned to the minor for the reason test.yml gives.
          go-version: '1.27'

      - uses: actions/setup-node@v4
        if: matrix.console
        with:
          # The version console.yml builds and tests it with.
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      # The console, built into console/dist as console/README.md says, where go:embed takes it into
      # agentiik-api. It is named with the version the programs record, which it reads from a build
      # of the smallest of them, since they are compiled after it and would carry none of it before.
      # Neither its dependencies nor its build leave the checkout dirty, since both are ignored, so
      # the version the programs record is the one it was given.
      - name: console
        if: matrix.console
        working-directory: console
        run: |
          probe=$RUNNER_TEMP/version-agk-helper
          (cd .. && CGO_ENABLED=0 go build -trimpath -o "$probe" ./cmd/agk-helper)
          recorded=$(go version -m "$probe" | awk '$1 == "mod" { print $3; exit }')
          echo "the console is built as ${recorded#v}"
          npm ci
          AGK_VERSION=${recorded#v} npm run build
          test -f dist/index.html || { echo "the console's build wrote no dist/index.html"; exit 1; }
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "the console's build left the checkout dirty"; exit 1; }

      # The binaries, built as build/*.Dockerfile and cmd/*/static_test.go build them, and the files
      # an image takes from the checkout, into a context of their own outside the checkout, which a
      # file there would leave dirty.
      - name: binaries
        env:
          COMMANDS: ${{ matrix.commands }}
          FILES: ${{ matrix.files }}
        run: |
          mkdir -p "$RUNNER_TEMP/context"
          for arch in amd64 arm64; do
            for cmd in $COMMANDS; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' \
                -o "$RUNNER_TEMP/context/$cmd-linux-$arch" ./cmd/$cmd
            done
          done
          for file in $FILES; do cp -p "$file" "$RUNNER_TEMP/context/"; done
          ls -l "$RUNNER_TEMP/context"

      # The version the image is labelled with is the one the binary records, which is what
      # agk-runner version prints and join sends: the tag at a release, a pseudo-version on main.
      # A release whose binary records anything but its tag was built from something else.
      #
      # latest follows the highest release, and never a pre-release or a patch to an older minor,
      # which would move it backwards.
      #
      # An image holding no program of this module is labelled with what one of them records, built
      # for that alone and left out of its context, so that every image of a commit says one version.
      - name: version
        id: version
        env:
          KIND: ${{ steps.plan.outputs.kind }}
          TAG: ${{ steps.plan.outputs.tag }}
          COMMANDS: ${{ matrix.commands }}
        run: |
          first=${COMMANDS%% *}
          binary=$RUNNER_TEMP/context/$first-linux-amd64
          if [ -z "$first" ]; then
            first=agk-helper binary=$RUNNER_TEMP/version-agk-helper
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$binary" ./cmd/agk-helper
          fi
          recorded=$(go version -m "$binary" | awk '$1 == "mod" { print $3; exit }')
          echo "$first records $recorded"
          case "$recorded" in
            v*) ;;
            *) echo "$first records no version, so the image would say nothing of what it holds"; exit 1 ;;
          esac
          if [ "$KIND" = release ]; then
            if [ "$recorded" != "$TAG" ]; then echo "$first records $recorded, and the tag is $TAG"; exit 1; fi
            tags="$TAG ${TAG#v}"
            highest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ "$TAG" = "$highest" ]; then tags="$tags latest"; else echo "$TAG is not the highest release ($highest), so latest stays where it is"; fi
          else
            tags=dev
          fi
          echo "version ${recorded#v}, tags $tags"
          {
            echo "version=${recorded#v}"
            echo "revision=$(git rev-parse HEAD)"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      # The registry a dry run pushes to, so that a branch goes through every step a release does,
      # the push and the checks of what was pushed included, with nothing leaving the job. Started
      # only for a dry run, so that a release does not depend on pulling an image it does not use.
      - name: registry
        if: steps.plan.outputs.publish != 'true'
        run: docker run -d --name registry -p 5000:5000 registry:2

      # arm64 under QEMU for the RUN steps the agentiik and postgres-upgrade images take from
      # alpine; the binaries themselves are cross-compiled above. The builder shares the job's
      # network, so a dry run reaches the registry at localhost.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - uses: docker/login-action@v3
        if: steps.plan.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile's labels go on each platform's image. The index carries them too, since
      # ghcr.io reads a multi-platform package's description and source from the index and not from
      # the images under it; they are read from the Dockerfile, so that it stays the one place they
      # are written.
      #
      # No provenance attestation: it would add an unknown/unknown entry beside the two platforms,
      # and what the release attests and signs is v0.8.0's.
      - name: build and push
        env:
          IMAGE: ${{ matrix.image }}
          REGISTRY: ${{ steps.plan.outputs.registry }}
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.version.outputs.revision }}
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          dockerfile=build/$IMAGE.Dockerfile
          label() { sed -n "s/.*org\.opencontainers\.image\.$1=\"\([^\"]*\)\".*/\1/p" "$dockerfile"; }
          args=()
          for t in $TAGS; do args+=(-t "$REGISTRY/$IMAGE:$t"); done
          for key in title description source licenses; do
            value=$(label $key)
            test -n "$value" || { echo "$dockerfile has no org.opencontainers.image.$key"; exit 1; }
            args+=(--annotation "index:org.opencontainers.image.$key=$value")
          done
          args+=(--annotation "index:org.opencontainers.image.version=$VERSION")
          args+=(--annotation "index:org.opencontainers.image.revision=$REVISION")
          docker buildx build --platform linux/amd64,linux/arm64 -f "$dockerfile" \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$REVISION" \
            --provenance=false --metadata-file "$RUNNER_TEMP/metadata.json" \
            "${args[@]}" --push "$RUNNER_TEMP/context"

      # What was pushed, read back from the registry: one index, both platforms and nothing else,
      # every tag on that index, and each platform's image labelled with this version and commit.
      - name: check
        env:
          PUBLISH: ${{ steps.plan.outputs.publish }}
          IMAGE: ${{ matrix.image }}
          REGISTRY: ${{ steps.plan.outputs.registry }}
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.version.outputs.revision }}
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          case "$digest" in sha256:*) ;; *) echo "the build reported no digest"; exit 1 ;; esac
          ref=$REGISTRY/$IMAGE@$digest
          echo "$ref"

          raw=$(docker buildx imagetools inspect --raw "$ref")
          echo "$raw" | jq .
          platforms=$(echo "$raw" | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')
          test "$platforms" = "linux/amd64 linux/arm64" || { echo "$ref holds $platforms"; exit 1; }
          for key in source version revision licenses; do
            test -n "$(echo "$raw" | jq -r --arg k "org.opencontainers.image.$key" '.annotations[$k] // empty')" \
              || { echo "the index carries no org.opencontainers.image.$key"; exit 1; }
          done

          for t in $TAGS; do
            got=$(docker buildx imagetools inspect --raw "$REGISTRY/$IMAGE:$t" | sha256sum | cut -d' ' -f1)
            test "sha256:$got" = "$digest" || { echo "$IMAGE:$t is sha256:$got, not $digest"; exit 1; }
            echo "$IMAGE:$t -> $digest"
          done

          for platform in linux/amd64 linux/arm64; do
            config=$(docker buildx imagetools inspect "$ref" --format "{{json (index .Image \"$platform\")}}")
            for pair in "version=$VERSION" "revision=$REVISION" "source=https://github.com/agentiik/agentiik"; do
              want=${pair#*=}
              got=$(echo "$config" | jq -r --arg k "org.opencontainers.image.${pair%%=*}" '.config.Labels[$k]')
              test "$got" = "$want" || { echo "$platform is labelled ${pair%%=*} $got, want $want"; exit 1; }
            done
            echo "$platform: $(echo "$config" | jq -c '{architecture, user: .config.User}')"
          done

          # Pulled as nobody, as an installation pulls it. A package the GITHUB_TOKEN creates in the
          # organisation starts private, and making it public is a setting of the package's that no
          # token of the workflow's can change, so until someone does, every publish says so here.
          if [ "$PUBLISH" = true ]; then
            docker logout ghcr.io
            docker buildx imagetools inspect "$ref" >/dev/null || {
              echo "$REGISTRY/$IMAGE was pushed and cannot be pulled anonymously: make the package public in its settings on GitHub"; exit 1; }
          fi

          echo "### $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ref\`, tagged $TAGS" >> "$GITHUB_STEP_SUMMARY"
