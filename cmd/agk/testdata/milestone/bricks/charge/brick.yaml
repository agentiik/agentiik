# The step the fan-out divides: one container per order, each charging the one order it was
# given, attaching a receipt, and refusing an order of nothing on its own port.
apiVersion: agentiik.dev/v1
kind: Brick
metadata:
  name: charge-order
  version: 0.1.0
  summary: Charges the order it is given, attaches a receipt, and rejects an order of nothing.
spec:
  inputs:
    in:
      schema: { type: object }
  outputs:
    ok:
      schema: { type: object }
    rejected:
      schema: { type: object }
  secrets:
    - { name: billing_api, mount: /agk/secrets/billing_api }
  runtime:
    network: none
    streaming: false
    user: "65532:65532"
