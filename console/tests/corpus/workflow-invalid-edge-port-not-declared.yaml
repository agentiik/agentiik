# invalid: An edge taking an output port nobody declares. normalize publishes
#   ok and rejected, and an edge cannot invent a third port on it.
# refused by: the validator, beyond what JSON Schema can state
# reference: https://agentiik.github.io/docs/#graph

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: monthly-invoicing
  namespace: finance

steps:
  normalize:
    image: ghcr.io/acme/agk-normalize@sha256:9f2c1d073f187ad520aaf67af255db9208210cfac76f1f2426ef8d938079b7e0
    outputs: [ok, rejected]

  archive:
    image: ghcr.io/acme/agk-archive@sha256:44de908840a673cc25120ecd3e506292d691f72937ce1da04a6ee4252ff4c115
    needs:
      - { step: normalize, port: maybe, as: in }
    outputs: [out]
