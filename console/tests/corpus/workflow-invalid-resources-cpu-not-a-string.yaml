# invalid: A CPU request written as a number. It is written as a string so
#   that half a core reads as 0.5 wherever it travels, in the workflow file,
#   in the brick manifest and in the task message alike. The manifest refuses
#   the same value, which is what keeps one concept to one spelling.
# refused by: the schema
# reference: https://agentiik.github.io/docs/#the-task-message

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: monthly-invoicing
  namespace: finance

steps:
  invoice:
    image: ghcr.io/acme/agk-invoice@sha256:1ab74e66e7966eea770c1042664af5f550650f299ce00e02132ffa4fec5039cc
    resources: { cpu: 0.5, memory: 256Mi }
    outputs: [out]
