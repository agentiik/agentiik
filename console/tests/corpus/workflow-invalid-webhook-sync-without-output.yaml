# invalid: A sync webhook naming no output. A sync response returns one
#   workflow output, and the trigger says which.
# refused by: the schema
# reference: https://agentiik.github.io/docs/#triggers

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: price-quotes
  namespace: sales

on:
  webhook:
    - path: /quotes/requested
      response: sync

outputs:
  quote:
    from: { step: quote, port: out }

steps:
  quote:
    image: ghcr.io/acme/agk-invoice@sha256:1ab74e66e7966eea770c1042664af5f550650f299ce00e02132ffa4fec5039cc
    outputs: [out]
