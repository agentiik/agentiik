    image: ghcr.io/acme/agk-normalize@sha256:9f2c1d073f187ad520aaf67af255db9208210cfac76f1f2426ef8d938079b7e0
    # the manifest of this image declares the input ports orders and customers
    inputs:
      suppliers: ${{ workflow.inputs.suppliers }}
    outputs: [ok, rejected]
