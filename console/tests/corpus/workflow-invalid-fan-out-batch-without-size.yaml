# invalid: A batch fan-out that does not say how many items go into a batch.
#   The size is written in the parentheses, as batch(50).
# refused by: the schema
# reference: https://agentiik.github.io/docs/#fan-out

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: reconciliation
  namespace: finance

steps:
  fetch-ledger:
    image: ghcr.io/acme/agk-normalize@sha256:9f2c1d073f187ad520aaf67af255db9208210cfac76f1f2426ef8d938079b7e0
    strategy:
      fan_out: batch
      max_parallel: 4
    outputs: [out]
