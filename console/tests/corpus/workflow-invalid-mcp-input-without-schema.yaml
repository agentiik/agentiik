# invalid: A workflow publishing a tool with an input that carries no schema.
#   Every input is one of the tool's arguments and the tool publishes their
#   schemas as its inputSchema, so an input with none would be an argument a
#   client is told nothing about.
# refused by: the schema
# reference: https://agentiik.github.io/docs/#publishing-tools

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: invoicing
  namespace: finance

inputs:
  orders:
    schema: { $ref: "./schemas/order.json" }
    required: true
  note:
    default: ""

mcp:
  name: create_invoice
  description: Issue one invoice for a customer.

steps:
  normalize:
    image: ghcr.io/acme/agk-normalize@sha256:9f2c1d073f187ad520aaf67af255db9208210cfac76f1f2426ef8d938079b7e0
    inputs:
      orders: ${{ workflow.inputs.orders }}
    outputs: [ok]
