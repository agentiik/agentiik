# invalid: A timeout on an async tool, where it would mean nothing: the call
#   returns the run identifier at once.
# refused by: the schema
# reference: https://agentiik.github.io/docs/#publishing-tools

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: invoicing
  namespace: finance

inputs:
  period:
    schema: { type: string }
    required: true

mcp:
  name: invoicing
  tools:
    - name: reconcile_month
      description: Reconcile a whole month. Long running; returns a run to follow.
      input:
        from: { input: period }
      mode: async
      timeout: 60s

steps:
  reconcile:
    image: ghcr.io/acme/agk-invoice@sha256:1ab74e66e7966eea770c1042664af5f550650f299ce00e02132ffa4fec5039cc
    inputs:
      period: ${{ workflow.inputs.period }}
    outputs: [out]
