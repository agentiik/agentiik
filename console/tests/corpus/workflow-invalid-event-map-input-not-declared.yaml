# invalid: An event trigger filling an input the workflow does not declare. map
#   builds the run's inputs, each validated against its schema before the run
#   exists, and an input nobody declared has none.
# refused by: the validator, beyond what JSON Schema can state
# reference: https://agentiik.github.io/docs/#triggers

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: order-fulfilment
  namespace: sales

on:
  event:
    - type: com.example.order.approved
      map:
        order: ${{ event.data.order }}

inputs:
  orders:
    schema: { type: array }

steps:
  ship:
    image: ghcr.io/acme/agk-invoice@sha256:1ab74e66e7966eea770c1042664af5f550650f299ce00e02132ffa4fec5039cc
    outputs: [out]
