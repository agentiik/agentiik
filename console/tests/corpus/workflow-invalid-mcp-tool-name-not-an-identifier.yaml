# invalid: A tool name that is not an identifier. Clients hold the name and send it back in every call, so it is kept to letters, digits, hyphens and underscores.
# refused by: the schema
# reference: https://agentiik.github.io/docs/#publishing-tools

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: invoicing
  namespace: finance

inputs:
  orders:
    schema: { $ref: "./schemas/order.json" }
    required: true

mcp:
  name: create invoice
  description: Issue one invoice for a customer.

steps:
  normalize:
    image: ghcr.io/acme/agk-normalize@sha256:9f2c1d073f187ad520aaf67af255db9208210cfac76f1f2426ef8d938079b7e0
    inputs:
      orders: ${{ workflow.inputs.orders }}
    outputs: [ok]
