# invalid: A schedule's zone written as an offset. An offset does not move with
#   daylight saving, which is what a named zone is for.
# refused by: the schema
# reference: https://agentiik.github.io/docs/#triggers

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: price-quotes
  namespace: sales

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "+02:00"

steps:
  quote:
    image: ghcr.io/acme/agk-invoice@sha256:1ab74e66e7966eea770c1042664af5f550650f299ce00e02132ffa4fec5039cc
    outputs: [out]
