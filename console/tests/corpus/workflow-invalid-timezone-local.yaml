# invalid: A schedule read in the installation's own zone. One file would fire
#   at different instants on two installations, so a schedule names its zone or
#   is read in UTC.
# refused by: the schema
# reference: https://agentiik.github.io/docs/#triggers

apiVersion: agentiik.dev/v1
kind: Workflow

metadata:
  name: price-quotes
  namespace: sales

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: Local

steps:
  quote:
    image: ghcr.io/acme/agk-invoice@sha256:1ab74e66e7966eea770c1042664af5f550650f299ce00e02132ffa4fec5039cc
    outputs: [out]
