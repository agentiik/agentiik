{{template "head" .}}
<body>
<main id="page" data-page="enrol" data-passkeys="{{.Passkeys}}">
<p class="brand">Agentiik</p>
<h1>Enrol a passkey</h1>
<noscript><p class="problem">This page runs the passkey ceremony with JavaScript, which this browser is not running for it.</p></noscript>
<p id="intro"></p>
<p id="unavailable" class="problem" hidden></p>

<form id="enrol" method="post" hidden>
<div id="code-field" hidden>
<label for="code">Recovery code</label>
<input id="code" name="code" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="agkenrol_…">
</div>
<label for="label">Name for this passkey <span class="hint">optional, to tell it from your others</span></label>
<input id="label" name="label" maxlength="256" autocomplete="off" placeholder="work laptop">
<button type="submit" id="enrol-button">Enrol a passkey</button>
</form>

<section id="enrolled" hidden>
<p id="enrolled-what"></p>
<ul>
<li>Enrol a second passkey on another device, so that losing this one is an inconvenience rather than an incident.</li>
<li>At a terminal, sign in with <code>agk login</code>.</li>
</ul>
</section>

<section id="signed-in" hidden>
<p id="who"></p>
<button type="button" id="sign-out" class="quiet">Sign out</button>
</section>

<p id="status" role="status" aria-live="polite"></p>
<p id="problem" class="problem" role="alert" hidden></p>

<footer><a href="sign-in">Sign in</a> with a passkey you hold already.</footer>
</main>
</body>
</html>
